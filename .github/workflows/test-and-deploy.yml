# 1. Weekly (and on request) rebuilds the card list from Scryfall and commits it if anything changed.
# 2. Runs the automatic tests on every change.
# 3. Publishes the site to GitHub Pages only when the tests pass on the main branch.
#
# To rebuild the card list right away: Actions tab → "Test and deploy" → Run workflow,
# or include "[update cards]" in a commit message.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 13 * * 2' # Tuesdays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update cards]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the card list from Scryfall
        run: node scripts/build-cards.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Commit the new card list if it changed
        run: |
          if git diff --quiet -- data/; then echo "Card list unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/cards-meta.json
          git commit -m "Update card list from Scryfall"
          git push

  test:
    needs: cards
    if: always() && needs.cards.result != 'failure' && needs.cards.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Save the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: test
    if: always() && needs.test.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html css js data _site/
          # Tag the code and style links with this update's version so browsers fetch the new files.
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(css/style\.css|js/firebase-config\.js|js/card-rules\.js|js/app\.js)\"#\1?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
