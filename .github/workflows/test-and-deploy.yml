# 1. Weekly (and on request) rebuilds the card list from Scryfall and commits it if anything changed.
# 2. Runs the automatic tests on every change, and tests the database rules on Firebase's emulator.
# 3. Publishes the site to GitHub Pages only when the tests pass on the main branch.
#
# To rebuild the card list right away: Actions tab → "Test and deploy" → Run workflow,
# or include "[update cards]" in a commit message.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 13 * * 2' # Tuesdays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update cards]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build the card list from Scryfall
        run: node scripts/build-cards.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Commit the new card list if it changed
        run: |
          if git diff --quiet -- data/; then echo "Card list unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/cards-meta.json
          git commit -m "Update card list from Scryfall"
          git push

  test:
    needs: cards
    if: always() && needs.cards.result != 'failure' && needs.cards.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Save the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: playwright-report
          retention-days: 7

  # Checks firestore.rules (the database's security rules and size limits) against Firebase's own emulator.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install the rules testing tools
        run: npm install --no-save --no-package-lock firebase-tools@15.34.2 @firebase/rules-unit-testing@6.0.0 firebase@13.2.0
      - name: Test the database rules
        run: npx firebase emulators:exec --only firestore --project demo-cdl "node --test tests/db-rules/rules.test.mjs"

  deploy:
    needs: [test, rules]
    if: always() && needs.test.result == 'success' && needs.rules.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: # only this job publishes
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build js/app.js from js/src
        run: node scripts/build-app.mjs
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html css js data icons manifest.webmanifest sw.js _site/
          rm -rf _site/js/src  # the pieces js/app.js was built from
          # Tag the code and style links with this update's version so browsers fetch the new files.
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(css/style\.css|js/firebase-config\.js|js/card-rules\.js|js/backdrop\.js|js/app\.js)\"#\1?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
          # Give the offline cache this update's version so the installed app picks up new files.
          sed -i "s/__VERSION__/$v/" _site/sw.js
          grep -c "cdl-$v" _site/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
