<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commander Deck Ledger</title>
<meta name="description" content="Track your Commander decks: every swap, every cut, every card you own, and a bin for spare copies.">
<meta property="og:title" content="Commander Deck Ledger">
<meta property="og:description" content="Track your Commander decks: every swap, every cut, every card you own.">
<meta name="theme-color" content="#0c0c0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 2h22l6 6v22H2z' fill='%230c0c0b'/%3E%3Cpath d='M8 9h16v3H8zm0 6h16v3H8zm0 6h10v3H8z' fill='%23d2ff1f'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deck Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;125,700;125,800&family=Michroma&family=Martian+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
// Apply a saved light/dark choice before the page draws (the switch is in the top bar).
try { var t = localStorage.getItem("cdl-theme"); if (t === "dark" || t === "light") { document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#0b0b0a" : "#efeef7"; } } catch (e) {}
</script>
<script src="js/firebase-config.js" defer></script>
<script src="js/card-rules.js" defer></script>
<script src="js/backdrop.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>
<!-- Loading screen: shown the moment the page opens, removed with a glitch by js/app.js once the decks are in. -->
<div id="boot" role="status" aria-label="Loading your decks">
  <div class="boot-in">
    <div class="boot-map" aria-hidden="true"></div>
    <div class="boot-t" data-text="DEFRAGMENTING" aria-hidden="true">DEFRAGMENTING</div>
    <div class="boot-s" aria-hidden="true"><span>Commander Deck Ledger</span><span class="boot-n">Restoring sectors</span></div>
  </div>
</div>
<script>
// Fills the defrag map with scattered fragments, and never leaves the screen up if the site fails to start.
(function () {
  var m = document.querySelector(".boot-map"), h = "", c = ["f1", "f2", "f3", "f0", "f0", "f0"];
  for (var k = 0; k < 96; k++) h += '<i class="' + c[Math.floor(Math.random() * c.length)] + '" style="--d:' + (k * 14 + Math.floor(Math.random() * 60)) + 'ms"></i>';
  m.innerHTML = h;
  setTimeout(function () { var b = document.getElementById("boot"); if (b) b.remove(); }, 15000);
})();
</script>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><h1>Commander Deck Ledger</h1><span class="barcode" aria-hidden="true"></span></div>
  </div>
  <div class="empty"><h2>Opening your library…</h2><p>Your decks load here in a moment.</p></div>
</div>
</body>
</html>
